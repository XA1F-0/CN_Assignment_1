info:
  name: 8. Delete an opportunity
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{baseUrl}}/api/opportunities/{{opportunityId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('Status code is 200', function () { expect(res.getStatus()).to.equal(200); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
