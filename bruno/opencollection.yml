opencollection: 1.0.0

info:
  name: Research Opportunity Portal
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: opportunityId
      value:
        type: number
        data: "1"

docs:
  content: Run requests 1 to 10 in order. Start the backend first.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
