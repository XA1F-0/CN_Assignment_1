info:
  name: 4. Get all opportunities
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/opportunities"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('Status code is 200', function () { expect(res.getStatus()).to.equal(200); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
