info:
  name: 9. Get deleted opportunity (404)
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/opportunities/{{opportunityId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('Status code is 404', function () { expect(res.getStatus()).to.equal(404); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
