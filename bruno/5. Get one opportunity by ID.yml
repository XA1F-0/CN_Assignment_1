info:
  name: 5. Get one opportunity by ID
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/opportunities/{{opportunityId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('Status code is 200', function () { expect(res.getStatus()).to.equal(200); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
